---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%Y年%m月%d日" }}
      </time>
      {% if page.tags %}
      <span class="post-tags">
        {% for tag in page.tags %}
        <span class="tag">{{ tag }}</span>
        {% endfor %}
      </span>
      {% endif %}

    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <div class="post-share">
      <a href="https://twitter.com/intent/tweet?text={{ page.title }}&url={{ site.url }}{{ page.url }}" target="_blank">分享到 Twitter</a>
      <a href="https://github.com/{{ site.social.github }}" target="_blank">在 GitHub 上关注我</a>
    </div>
  </footer>
</article>

{% if site.comments.enabled %}
<div class="comments">
  <!-- 评论系统占位 -->
</div>
{% endif %}

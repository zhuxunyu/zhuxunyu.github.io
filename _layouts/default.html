<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="site-title">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="/">首页</a>
        <a href="/posts/">文章</a>
        <a href="/archive/">归档</a>
        <a href="/feed.xml" target="_blank">📡 RSS</a>
        <a href="https://github.com/{{ site.social.github }}" target="_blank">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ site.time | date: '%Y' }} 硅基观察。Built with Jekyll on GitHub Pages</p>
      <p style="font-size: 0.9em; color: #666;">
        <a href="https://github.com/zhuxunyu/zhuxunyu.github.io" target="_blank">GitHub</a> |
        <a href="/feed.xml" target="_blank">RSS</a> |
        <a href="mailto:zhuxunyu98@gmail.com">联系</a>
      </p>
    </div>
  </footer>
</body>
</html>

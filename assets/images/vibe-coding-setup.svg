<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Desk -->
  <rect x="0" y="450" width="800" height="150" fill="#2d2d44"/>
  
  <!-- Monitor -->
  <rect x="200" y="150" width="400" height="250" rx="10" fill="#1a1a2e" stroke="#e94560" stroke-width="3"/>
  <rect x="215" y="165" width="370" height="220" rx="5" fill="url(#screen)"/>
  
  <!-- Code lines on screen -->
  <g fill="#00ff9d" font-family="monospace" font-size="12">
    <rect x="230" y="180" width="200" height="8" rx="2" opacity="0.7"/>
    <rect x="230" y="195" width="180" height="8" rx="2" opacity="0.6"/>
    <rect x="230" y="210" width="220" height="8" rx="2" opacity="0.8"/>
    <rect x="230" y="225" width="160" height="8" rx="2" opacity="0.5"/>
    <rect x="230" y="240" width="240" height="8" rx="2" opacity="0.7"/>
    <rect x="230" y="255" width="190" height="8" rx="2" opacity="0.6"/>
    <rect x="230" y="270" width="210" height="8" rx="2" opacity="0.8"/>
    <rect x="230" y="285" width="170" height="8" rx="2" opacity="0.5"/>
    <rect x="230" y="300" width="230" height="8" rx="2" opacity="0.7"/>
    <rect x="230" y="315" width="200" height="8" rx="2" opacity="0.6"/>
    <rect x="230" y="330" width="180" height="8" rx="2" opacity="0.8"/>
  </g>
  
  <!-- Monitor stand -->
  <rect x="350" y="400" width="100" height="50" fill="#2d2d44"/>
  <rect x="300" y="445" width="200" height="10" rx="3" fill="#1a1a2e"/>
  
  <!-- Keyboard -->
  <rect x="250" y="480" width="300" height="60" rx="5" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>
  <g fill="#e94560">
    <rect x="260" y="490" width="15" height="15" rx="2"/>
    <rect x="280" y="490" width="15" height="15" rx="2"/>
    <rect x="300" y="490" width="15" height="15" rx="2"/>
    <rect x="320" y="490" width="15" height="15" rx="2"/>
    <rect x="340" y="490" width="15" height="15" rx="2"/>
    <rect x="360" y="490" width="15" height="15" rx="2"/>
    <rect x="380" y="490" width="15" height="15" rx="2"/>
    <rect x="400" y="490" width="15" height="15" rx="2"/>
    <rect x="420" y="490" width="15" height="15" rx="2"/>
    <rect x="440" y="490" width="15" height="15" rx="2"/>
    <rect x="460" y="490" width="15" height="15" rx="2"/>
    <rect x="480" y="490" width="15" height="15" rx="2"/>
    <rect x="500" y="490" width="15" height="15" rx="2"/>
    <rect x="520" y="490" width="15" height="15" rx="2"/>
    
    <rect x="260" y="510" width="15" height="15" rx="2"/>
    <rect x="280" y="510" width="15" height="15" rx="2"/>
    <rect x="300" y="510" width="15" height="15" rx="2"/>
    <rect x="320" y="510" width="15" height="15" rx="2"/>
    <rect x="340" y="510" width="15" height="15" rx="2"/>
    <rect x="360" y="510" width="15" height="15" rx="2"/>
    <rect x="380" y="510" width="15" height="15" rx="2"/>
    <rect x="400" y="510" width="15" height="15" rx="2"/>
    <rect x="420" y="510" width="15" height="15" rx="2"/>
    <rect x="440" y="510" width="15" height="15" rx="2"/>
    <rect x="460" y="510" width="15" height="15" rx="2"/>
    <rect x="480" y="510" width="15" height="15" rx="2"/>
    <rect x="500" y="510" width="15" height="15" rx="2"/>
    <rect x="520" y="510" width="15" height="15" rx="2"/>
  </g>
  
  <!-- Plant -->
  <circle cx="650" cy="470" r="40" fill="#2d2d44"/>
  <ellipse cx="650" cy="450" rx="30" ry="40" fill="#4a7c59"/>
  <ellipse cx="635" cy="440" rx="20" ry="30" fill="#5a8c69"/>
  <ellipse cx="665" cy="445" rx="25" ry="35" fill="#3a6c49"/>
  
  <!-- Coffee cup -->
  <rect x="120" y="460" width="50" height="60" rx="5" fill="#e94560"/>
  <rect x="125" y="465" width="40" height="45" rx="3" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="145" cy="460" rx="25" ry="8" fill="#1a1a2e"/>
  
  <!-- Lamp -->
  <rect x="50" y="350" width="10" height="100" fill="#2d2d44"/>
  <circle cx="55" cy="350" r="30" fill="#ffd700" opacity="0.6"/>
  <circle cx="55" cy="350" r="50" fill="#ffd700" opacity="0.2"/>
  
  <!-- Title -->
  <text x="400" y="80" text-anchor="middle" fill="#e94560" font-size="36" font-weight="bold" font-family="Arial">Vibe Coding</text>
  <text x="400" y="110" text-anchor="middle" fill="#ffffff" font-size="18" font-family="Arial" opacity="0.7">程序员的氛围感革命</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="5" fill="#e94560" opacity="0.5"/>
  <circle cx="700" cy="120" r="8" fill="#00ff9d" opacity="0.4"/>
  <circle cx="720" cy="80" r="4" fill="#ffd700" opacity="0.6"/>
</svg>

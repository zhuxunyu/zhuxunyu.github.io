<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <rect fill="#1a1a2e" width="800" height="350"/>
  <text x="400" y="30" text-anchor="middle" fill="#eee" font-size="18">Flowise 工作流程架构</text>
  
  <!-- 用户输入 -->
  <rect x="50" y="70" width="120" height="50" fill="#e94560" rx="8"/>
  <text x="110" y="100" text-anchor="middle" fill="#fff" font-size="14">👤 用户提问</text>
  
  <!-- 文档加载 -->
  <rect x="220" y="70" width="120" height="50" fill="#0f3460" rx="8"/>
  <text x="280" y="95" text-anchor="middle" fill="#fff" font-size="12">📄 文档加载</text>
  <text x="280" y="112" text-anchor="middle" fill="#888" font-size="10">PDF/URL/Text</text>
  
  <!-- 文本分割 -->
  <rect x="390" y="70" width="120" height="50" fill="#0f3460" rx="8"/>
  <text x="450" y="95" text-anchor="middle" fill="#fff" font-size="12">✂️ 文本分割</text>
  <text x="450" y="112" text-anchor="middle" fill="#888" font-size="10">分块处理</text>
  
  <!-- 向量存储 -->
  <rect x="560" y="70" width="120" height="50" fill="#0f3460" rx="8"/>
  <text x="620" y="95" text-anchor="middle" fill="#fff" font-size="12">🗄️ 向量存储</text>
  <text x="620" y="112" text-anchor="middle" fill="#888" font-size="10">Chroma/FAISS</text>
  
  <!-- 检索 -->
  <rect x="390" y="170" width="120" height="50" fill="#00adb5" rx="8"/>
  <text x="450" y="195" text-anchor="middle" fill="#fff" font-size="12">🔍 语义检索</text>
  <text x="450" y="212" text-anchor="middle" fill="#888" font-size="10">查找相关片段</text>
  
  <!-- LLM -->
  <rect x="560" y="170" width="120" height="50" fill="#e94560" rx="8"/>
  <text x="620" y="195" text-anchor="middle" fill="#fff" font-size="12">🤖 LLM 生成</text>
  <text x="620" y="212" text-anchor="middle" fill="#888" font-size="10">GPT/Claude 等</text>
  
  <!-- 输出 -->
  <rect x="390" y="270" width="120" height="50" fill="#4caf50" rx="8"/>
  <text x="450" y="300" text-anchor="middle" fill="#fff" font-size="14">✅ 返回答案</text>
  
  <!-- 连接线 -->
  <line x1="170" y1="95" x2="220" y2="95" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="95" x2="390" y2="95" stroke="#666" stroke-width="2"/>
  <line x1="510" y1="95" x2="560" y2="95" stroke="#666" stroke-width="2"/>
  <line x1="450" y1="120" x2="450" y2="170" stroke="#666" stroke-width="2"/>
  <line x1="510" y1="195" x2="560" y2="195" stroke="#666" stroke-width="2"/>
  <line x1="620" y1="220" x2="620" y2="270" stroke="#666" stroke-width="2"/>
  <line x1="620" y1="295" x2="510" y2="295" stroke="#666" stroke-width="2"/>
  <line x1="510" y1="295" x2="510" y2="250" stroke="#666" stroke-width="2"/>
  <line x1="510" y1="250" x2="450" y2="250" stroke="#666" stroke-width="2"/>
  <line x1="450" y1="250" x2="450" y2="270" stroke="#666" stroke-width="2"/>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>

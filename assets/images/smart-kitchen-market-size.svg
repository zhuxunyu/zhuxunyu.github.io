<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">中国智能厨房市场规模预测（亿元）</text>
  
  <!-- Y-axis -->
  <line x1="80" y1="80" x2="80" y2="350" stroke="#333" stroke-width="2"/>
  
  <!-- X-axis -->
  <line x1="80" y1="350" x2="750" y2="350" stroke="#333" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="70" y="355" text-anchor="end" font-family="Arial" font-size="12" fill="#666">0</text>
  <text x="70" y="285" text-anchor="end" font-family="Arial" font-size="12" fill="#666">1000</text>
  <text x="70" y="215" text-anchor="end" font-family="Arial" font-size="12" fill="#666">2000</text>
  <text x="70" y="145" text-anchor="end" font-family="Arial" font-size="12" fill="#666">3000</text>
  <text x="70" y="85" text-anchor="end" font-family="Arial" font-size="12" fill="#666">4000</text>
  
  <!-- Grid lines -->
  <line x1="80" y1="280" x2="750" y2="280" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="80" y1="210" x2="750" y2="210" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="80" y1="140" x2="750" y2="140" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="80" y1="80" x2="750" y2="80" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- Bars -->
  <!-- 2024: 850 -->
  <rect x="120" y="244" width="100" height="106" fill="url(#barGrad1)" rx="4"/>
  <text x="170" y="235" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1976D2">850</text>
  <text x="170" y="370" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">2024</text>
  
  <!-- 2025: 1200 -->
  <rect x="270" y="195" width="100" height="155" fill="url(#barGrad2)" rx="4"/>
  <text x="320" y="186" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#4A90E2">1200</text>
  <text x="320" y="370" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">2025</text>
  
  <!-- 2026: 1800 -->
  <rect x="420" y="120" width="100" height="230" fill="url(#barGrad3)" rx="4"/>
  <text x="470" y="111" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#9013FE">1800</text>
  <text x="470" y="370" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">2026</text>
  
  <!-- 2028: 3000 -->
  <rect x="570" y="0" width="100" height="350" fill="url(#barGrad4)" rx="4"/>
  <text x="620" y="-10" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#7B1FA2">3000</text>
  <text x="620" y="370" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">2028</text>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E57373;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Growth rate annotation -->
  <path d="M 230 200 Q 270 180, 310 200" fill="none" stroke="#388E3C" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="270" y="175" text-anchor="middle" font-family="Arial" font-size="11" fill="#388E3C">+41%</text>
  
  <path d="M 380 125 Q 420 105, 460 125" fill="none" stroke="#F57C00" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="420" y="100" text-anchor="middle" font-family="Arial" font-size="11" fill="#F57C00">+50%</text>
  
  <path d="M 530 50 Q 570 30, 610 50" fill="none" stroke="#D32F2F" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="570" y="25" text-anchor="middle" font-family="Arial" font-size="11" fill="#D32F2F">年复合 35%+</text>
  
  <!-- Y-axis label -->
  <text x="30" y="215" text-anchor="middle" font-family="Arial" font-size="13" fill="#666" transform="rotate(-90, 30, 215)">市场规模（亿元）</text>
</svg>
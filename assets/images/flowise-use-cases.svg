<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect fill="#1a1a2e" width="800" height="450"/>
  <text x="400" y="35" text-anchor="middle" fill="#eee" font-size="18">Flowise 实战应用场景</text>
  
  <!-- 场景 1 -->
  <rect x="40" y="70" width="220" height="160" fill="#16213e" stroke="#e94560" stroke-width="2" rx="10"/>
  <text x="150" y="100" text-anchor="middle" fill="#e94560" font-size="16">📞 客服问答机器人</text>
  <text x="150" y="130" text-anchor="middle" fill="#ccc" font-size="12">基于公司文档</text>
  <text x="150" y="150" text-anchor="middle" fill="#ccc" font-size="12">自动回答客户问题</text>
  <text x="150" y="170" text-anchor="middle" fill="#ccc" font-size="12">7x24 小时在线</text>
  <text x="150" y="200" text-anchor="middle" fill="#888" font-size="11">搭建时间：20 分钟</text>
  
  <!-- 场景 2 -->
  <rect x="290" y="70" width="220" height="160" fill="#16213e" stroke="#00adb5" stroke-width="2" rx="10"/>
  <text x="400" y="100" text-anchor="middle" fill="#00adb5" font-size="16">📄 文档分析工作流</text>
  <text x="400" y="130" text-anchor="middle" fill="#ccc" font-size="12">自动提取关键信息</text>
  <text x="400" y="150" text-anchor="middle" fill="#ccc" font-size="12">生成摘要和标签</text>
  <text x="400" y="170" text-anchor="middle" fill="#ccc" font-size="12">批量处理文档</text>
  <text x="400" y="200" text-anchor="middle" fill="#888" font-size="11">搭建时间：30 分钟</text>
  
  <!-- 场景 3 -->
  <rect x="540" y="70" width="220" height="160" fill="#16213e" stroke="#ffc107" stroke-width="2" rx="10"/>
  <text x="650" y="100" text-anchor="middle" fill="#ffc107" font-size="16">🤖 多 Agent 协作</text>
  <text x="650" y="130" text-anchor="middle" fill="#ccc" font-size="12">研究员 + 分析师 + 写作者</text>
  <text x="650" y="150" text-anchor="middle" fill="#ccc" font-size="12">协同完成复杂任务</text>
  <text x="650" y="170" text-anchor="middle" fill="#ccc" font-size="12">共享记忆上下文</text>
  <text x="650" y="200" text-anchor="middle" fill="#888" font-size="11">搭建时间：45 分钟</text>
  
  <!-- 底部更多场景 -->
  <rect x="40" y="260" width="340" height="160" fill="#16213e" stroke="#9c27b0" stroke-width="2" rx="10"/>
  <text x="210" y="290" text-anchor="middle" fill="#9c27b0" font-size="16">📊 数据分析报告</text>
  <text x="210" y="320" text-anchor="middle" fill="#ccc" font-size="12">连接数据库 → 分析数据 → 生成可视化报告</text>
  <text x="210" y="345" text-anchor="middle" fill="#ccc" font-size="12">适用：销售分析、用户行为、市场趋势</text>
  <text x="210" y="390" text-anchor="middle" fill="#888" font-size="11">搭建时间：40 分钟</text>
  
  <rect x="420" y="260" width="340" height="160" fill="#16213e" stroke="#4caf50" stroke-width="2" rx="10"/>
  <text x="590" y="290" text-anchor="middle" fill="#4caf50" font-size="16">📧 邮件自动处理</text>
  <text x="590" y="320" text-anchor="middle" fill="#ccc" font-size="12">读取邮件 → 分类 → 提取信息 → 回复/转办</text>
  <text x="590" y="345" text-anchor="middle" fill="#ccc" font-size="12">适用：客户咨询、订单处理、预约管理</text>
  <text x="590" y="390" text-anchor="middle" fill="#888" font-size="11">搭建时间：35 分钟</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">智能厨房产业链价值分布</text>
  
  <!-- Upstream -->
  <rect x="50" y="70" width="220" height="140" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="160" y="100" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1565C0">⬆️ 上游</text>
  <text x="160" y="125" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">芯片与传感器</text>
  <line x1="70" y1="135" x2="250" y2="135" stroke="#BBDEFB" stroke-width="1"/>
  <text x="160" y="155" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">• 华为海思（AI 芯片）</text>
  <text x="160" y="172" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">• 地平线（视觉芯片）</text>
  <text x="160" y="189" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">• 歌尔/汉威（传感器）</text>
  <rect x="100" y="195" width="120" height="25" rx="4" fill="#1976D2"/>
  <text x="160" y="212" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">利润率 30-50%</text>
  
  <!-- Arrow down -->
  <path d="M 160 220 L 160 250" stroke="#9013FE" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Midstream -->
  <rect x="290" y="70" width="220" height="140" rx="10" fill="#F3E5F5" stroke="#9013FE" stroke-width="2"/>
  <text x="400" y="100" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#7B1FA2">➡️ 中游</text>
  <text x="400" y="125" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">设备制造商</text>
  <line x1="310" y1="135" x2="490" y2="135" stroke="#E1BEE7" stroke-width="1"/>
  <text x="400" y="155" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">• 海尔/美的/格力</text>
  <text x="400" y="172" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">• 老板/方太</text>
  <text x="400" y="189" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">• 小米/华为（新势力）</text>
  <rect x="340" y="195" width="120" height="25" rx="4" fill="#9013FE"/>
  <text x="400" y="212" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">利润率 15-25%</text>
  
  <!-- Arrow down -->
  <path d="M 400 220 L 400 250" stroke="#9013FE" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Downstream -->
  <rect x="530" y="70" width="220" height="140" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="640" y="100" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#2E7D32">⬇️ 下游</text>
  <text x="640" y="125" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">渠道与服务</text>
  <line x1="550" y1="135" x2="730" y2="135" stroke="#C8E6C9" stroke-width="1"/>
  <text x="640" y="155" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">• 京东/天猫/抖音</text>
  <text x="640" y="172" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">• 安装/延保服务</text>
  <text x="640" y="189" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">• 菜谱/食材订阅</text>
  <rect x="580" y="195" width="120" height="25" rx="4" fill="#388E3C"/>
  <text x="640" y="212" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">利润率 10-40%</text>
  
  <!-- Value flow -->
  <rect x="50" y="260" width="700" height="150" rx="10" fill="#FFF8E1" stroke="#FFC107" stroke-width="2"/>
  <text x="400" y="290" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#F57C00">💰 价值流动趋势</text>
  
  <!-- Value distribution -->
  <text x="150" y="325" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">硬件销售</text>
  <text x="150" y="345" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">一次性收入</text>
  <rect x="100" y="355" width="100" height="40" fill="#FFB74D" rx="4"/>
  <text x="150" y="380" text-anchor="middle" font-family="Arial" font-size="10" fill="white">传统模式</text>
  
  <path d="M 210 375 L 280 375" stroke="#F57C00" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <text x="350" y="325" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">硬件 + 服务</text>
  <text x="350" y="345" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">持续性收入</text>
  <rect x="300" y="355" width="100" height="40" fill="#81C784" rx="4"/>
  <text x="350" y="380" text-anchor="middle" font-family="Arial" font-size="10" fill="white">订阅制</text>
  
  <path d="M 410 375 L 480 375" stroke="#F57C00" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <text x="580" y="325" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">服务为主</text>
  <text x="580" y="345" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">高利润率</text>
  <rect x="530" y="355" width="100" height="40" fill="#4DB6AC" rx="4"/>
  <text x="580" y="380" text-anchor="middle" font-family="Arial" font-size="10" fill="white">生态盈利</text>
  
  <!-- Bottom annotation -->
  <text x="400" y="425" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">趋势：硬件利润↓ 服务利润↑ 生态价值最大化</text>
</svg>
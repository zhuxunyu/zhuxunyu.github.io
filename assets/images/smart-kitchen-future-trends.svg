<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">2026-2028 智能厨房发展趋势</text>
  
  <!-- Trend 1 -->
  <rect x="50" y="70" width="340" height="110" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="80" y="100" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold" fill="#1565C0">🤖 趋势 1: AI 大模型深度集成</text>
  <text x="80" y="125" text-anchor="start" font-family="Arial" font-size="11" fill="#333">• 2026 下半年主流品牌集成</text>
  <text x="80" y="145" text-anchor="start" font-family="Arial" font-size="11" fill="#333">• 自然语言交互："今晚想吃川菜"</text>
  <text x="80" y="165" text-anchor="start" font-family="Arial" font-size="11" fill="#333">• 端侧大模型（本地运行）</text>
  <rect x="240" y="155" width="140" height="20" rx="4" fill="#1976D2"/>
  <text x="310" y="169" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">2026 H2</text>
  
  <!-- Trend 2 -->
  <rect x="410" y="70" width="340" height="110" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="440" y="100" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold" fill="#2E7D32">👨‍🍳 趋势 2: 厨房机器人普及</text>
  <text x="440" y="125" text-anchor="start" font-family="Arial" font-size="11" fill="#333">• 2027 年进入万元价位</text>
  <text x="440" y="145" text-anchor="start" font-family="Arial" font-size="11" fill="#333">• 自动炒菜/备菜/清洁</text>
  <text x="440" y="165" text-anchor="start" font-family="Arial" font-size="11" fill="#333">• 真正解放双手</text>
  <rect x="600" y="155" width="140" height="20" rx="4" fill="#388E3C"/>
  <text x="670" y="169" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">2027</text>
  
  <!-- Trend 3 -->
  <rect x="50" y="200" width="340" height="110" rx="10" fill="#FFF3E0" stroke="#F57C00" stroke-width="2"/>
  <text x="80" y="230" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold" fill="#EF6C00">💚 趋势 3: 健康管理系统</text>
  <text x="80" y="255" text-anchor="start" font-family="Arial" font-size="11" fill="#333">• 厨房=家庭健康管理中心</text>
  <text x="80" y="275" text-anchor="start" font-family="Arial" font-size="11" fill="#333">• 营养分析/健康建议</text>
  <text x="80" y="295" text-anchor="start" font-family="Arial" font-size="11" fill="#333">• 慢病管理（糖尿病/高血压）</text>
  <rect x="240" y="285" width="140" height="20" rx="4" fill="#F57C00"/>
  <text x="310" y="299" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">2027-2028</text>
  
  <!-- Trend 4 -->
  <rect x="410" y="200" width="340" height="110" rx="10" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <text x="440" y="230" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold" fill="#6A1B9A">💳 趋势 4: 订阅制服务</text>
  <text x="440" y="255" text-anchor="start" font-family="Arial" font-size="11" fill="#333">• 硬件不赚钱，服务赚钱</text>
  <text x="440" y="275" text-anchor="start" font-family="Arial" font-size="11" fill="#333">• 菜谱订阅 ¥19/月</text>
  <text x="440" y="295" text-anchor="start" font-family="Arial" font-size="11" fill="#333">• 食材配送/设备延保</text>
  <rect x="600" y="285" width="140" height="20" rx="4" fill="#9C27B0"/>
  <text x="670" y="299" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">2028+</text>
  
  <!-- Timeline -->
  <line x1="50" y1="360" x2="750" y2="360" stroke="#9013FE" stroke-width="3"/>
  
  <!-- Timeline markers -->
  <circle cx="150" cy="360" r="8" fill="#1976D2"/>
  <text x="150" y="385" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1565C0">2026</text>
  <text x="150" y="400" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">AI 集成</text>
  
  <circle cx="350" cy="360" r="8" fill="#388E3C"/>
  <text x="350" y="385" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2E7D32">2027</text>
  <text x="350" y="400" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">机器人</text>
  
  <circle cx="550" cy="360" r="8" fill="#F57C00"/>
  <text x="550" y="385" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#EF6C00">2028</text>
  <text x="550" y="400" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">健康管理</text>
  
  <circle cx="700" cy="360" r="8" fill="#9C27B0"/>
  <text x="700" y="385" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#6A1B9A">2028+</text>
  <text x="700" y="400" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">订阅制</text>
  
  <!-- Bottom annotation -->
  <rect x="50" y="415" width="700" height="30" rx="6" fill="#F3E5F5" stroke="#9013FE" stroke-width="1"/>
  <text x="400" y="435" text-anchor="middle" font-family="Arial" font-size="11" fill="#7B1FA2">核心逻辑：从"硬件销售"向"服务运营"转型，生态价值最大化</text>
</svg>
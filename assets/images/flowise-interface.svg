<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect fill="#1a1a2e" width="800" height="500"/>
  <text x="400" y="40" text-anchor="middle" fill="#eee" font-size="20" font-family="Arial">Flowise 工作界面</text>
  
  <!-- 左侧组件面板 -->
  <rect x="20" y="70" width="180" height="400" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <text x="110" y="95" text-anchor="middle" fill="#eee" font-size="14">组件库</text>
  
  <!-- 组件项 -->
  <rect x="35" y="115" width="150" height="35" fill="#0f3460" rx="5"/>
  <text x="110" y="138" text-anchor="middle" fill="#fff" font-size="12">📄 Document Loader</text>
  
  <rect x="35" y="160" width="150" height="35" fill="#0f3460" rx="5"/>
  <text x="110" y="183" text-anchor="middle" fill="#fff" font-size="12">✂️ Text Splitter</text>
  
  <rect x="35" y="205" width="150" height="35" fill="#0f3460" rx="5"/>
  <text x="110" y="228" text-anchor="middle" fill="#fff" font-size="12">🗄️ Vector Store</text>
  
  <rect x="35" y="250" width="150" height="35" fill="#0f3460" rx="5"/>
  <text x="110" y="273" text-anchor="middle" fill="#fff" font-size="12">🤖 LLM Chain</text>
  
  <rect x="35" y="295" width="150" height="35" fill="#0f3460" rx="5"/>
  <text x="110" y="318" text-anchor="middle" fill="#fff" font-size="12">🔗 Retrieval QA</text>
  
  <!-- 中央画布 -->
  <rect x="220" y="70" width="560" height="400" fill="#0f0f23" stroke="#0f3460" stroke-width="2"/>
  <text x="500" y="95" text-anchor="middle" fill="#888" font-size="14">工作流画布（拖拽区域）</text>
  
  <!-- 工作流节点示例 -->
  <rect x="280" y="150" width="120" height="50" fill="#e94560" rx="8"/>
  <text x="340" y="180" text-anchor="middle" fill="#fff" font-size="12">PDF 文档</text>
  
  <rect x="440" y="150" width="120" height="50" fill="#0f3460" rx="8"/>
  <text x="500" y="180" text-anchor="middle" fill="#fff" font-size="12">文本分割</text>
  
  <rect x="600" y="150" width="120" height="50" fill="#0f3460" rx="8"/>
  <text x="660" y="180" text-anchor="middle" fill="#fff" font-size="12">向量存储</text>
  
  <rect x="440" y="250" width="120" height="50" fill="#e94560" rx="8"/>
  <text x="500" y="280" text-anchor="middle" fill="#fff" font-size="12">LLM 模型</text>
  
  <rect x="440" y="350" width="120" height="50" fill="#00adb5" rx="8"/>
  <text x="500" y="380" text-anchor="middle" fill="#fff" font-size="12">输出结果</text>
  
  <!-- 连接线 -->
  <line x1="400" y1="175" x2="440" y2="175" stroke="#666" stroke-width="2"/>
  <line x1="560" y1="175" x2="600" y2="175" stroke="#666" stroke-width="2"/>
  <line x1="500" y1="200" x2="500" y2="250" stroke="#666" stroke-width="2"/>
  <line x1="500" y1="300" x2="500" y2="350" stroke="#666" stroke-width="2"/>
</svg>

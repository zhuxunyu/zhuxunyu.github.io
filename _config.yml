# 博客配置
title: zhuxunyu's Blog
description: Developer | AI Enthusiast | Open Source Contributor
url: "https://zhuxunyu.github.io"
baseurl: ""

# 构建设置
markdown: kramdown
highlighter: rouge
permalink: /posts/:year-:month-:day-:title/

# 页面设置
paginate: 10
paginate_path: "/page/:num/"

# 社交链接
social:
  github: zhuxunyu
  email: zhuxunyu98@gmail.com

# 默认布局
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

# 排除文件
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts/
